name: Project 49 CI

on:
  pull_request:
    paths:
      - "49-ai-ticket-triage/**"
      - ".github/workflows/project-49-ci.yml"
  push:
    branches: [main]
    paths:
      - "49-ai-ticket-triage/**"
      - ".github/workflows/project-49-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 49-ai-ticket-triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Verify generated workflows are committed
        run: git diff --exit-code -- workflows/
